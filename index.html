    <script>
      // Catch and suppress benign dev websocket disconnection errors
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
        }
      });
    </script>
